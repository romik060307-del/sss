plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rk.wacloning'
    compileSdk 36

    defaultConfig {
        applicationId 'com.rk.wacloning'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '2.3.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
